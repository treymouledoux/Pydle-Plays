name: Update Pydle progress

on:
  push:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pydle-progress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  progress:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test progress calculations
        run: python -m unittest discover -s tests
      - name: Install browser
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Update README from archive
        env:
          PYDLE_ARCHIVE_URL: ${{ vars.PYDLE_ARCHIVE_URL }}
        run: python scripts/update_progress.py
      - name: Commit updated progress
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/pydle-progress.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Pydle progress"
          git push
